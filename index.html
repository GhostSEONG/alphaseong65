<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>

  <!-- 1. HTML 메타 태그를 통한 즉시 이동 (0초 대기 후 이동) -->
  <meta http-equiv="refresh" content="0; url=https://ghostseong.github.io/alphaseong65/main/">

  <!-- 2. 자바스크립트를 통한 즉시 이동 -->
  <script>
    window.location.replace("https://ghostseong.github.io/alphaseong65/main/");
  </script>
</head>
<body>
  <!-- 브라우저 설정으로 이동이 지연되거나 막혔을 경우 표시할 링크 -->
  <p>페이지를 이동 중입니다. 자동으로 이동하지 않으면 <a href="https://ghostseong.github.io/alphaseong65/main/">여기를 클릭하세요</a>.</p>
</body>
</html>
